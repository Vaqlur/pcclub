[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pcclub-backend"
version = "0.1.0"
description = "PC club management backend (Kazakhstan): booking, payments, age rule"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Optional: throwaway PostgreSQL for tests when no TEST_DATABASE_URL is configured.
embedded-pg = ["pixeltable-pgserver>=0.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "requires_overlap_constraints: needs migration 0002 (btree_gist), i.e. a real PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults
    "RUF001", # Cyrillic in strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
